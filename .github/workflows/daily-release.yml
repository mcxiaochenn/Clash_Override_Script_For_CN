# 每日自动发布（Daily Release）
# 每天北京时间 8:00（UTC 0:00）自动构建并发布每日版
# 版本格式：vYYYY.MM.DD.NB（Shanghai 时区，NB 每日重置）

name: Daily Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          DATE=$(TZ=Asia/Shanghai date +"%Y.%m.%d")
          echo "date=$DATE" >> $GITHUB_OUTPUT

          # 用本地 tag 计数。此前用 gh api --paginate + jq 聚合：--paginate 会对每一页
          # 各输出一次 jq 结果，仓库 release 数超过单页上限后 EXISTING 变成多行字符串，
          # 导致 $((EXISTING + 1)) 报 syntax error in expression 并使整个 job 失败。
          EXISTING=$(git tag -l "v${DATE}.*" | wc -l | tr -d '[:space:]')
          EXISTING=${EXISTING:-0}

          NB=$(printf "%02d" $((EXISTING + 1)))
          VERSION="v${DATE}.${NB}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Update version in script
        run: |
          sed -i "s|// 版本：.*|// 版本：${{ steps.version.outputs.version }}|" mihomo-cn-override.js

      - name: Verify script syntax
        run: node --check mihomo-cn-override.js

      - name: Commit version change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mihomo-cn-override.js
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Get changelog
        id: changelog
        run: |
          # 单页查询即可拿到最新的 prerelease：releases 按创建时间倒序返回，
          # 因此不需要 --paginate，否则多页会各返回一个 .[0].tag_name
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '[.[] | select(.prerelease)] | .[0].tag_name' 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "null" ]; then
            echo "changelog=Initial release" >> $GITHUB_OUTPUT
          else
            LOG=$(git log "${PREV_TAG}..HEAD" --oneline --no-merges | head -20)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$LOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "## Daily Build ${{ steps.version.outputs.version }}

          ${{ steps.changelog.outputs.changelog }}

          ---
          > 这是每日自动构建版本。稳定版请使用 Latest。" \
            --prerelease \
            mihomo-cn-override.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update build/daily for CDN
        run: |
          mkdir -p build/daily
          cp mihomo-cn-override.js build/daily/mihomo-cn-override-daily.js
          git add build/daily/
          git diff --cached --quiet || git commit -m "chore: update build/daily to ${{ steps.version.outputs.version }}"
          git push
